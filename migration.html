<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>RESTAURATION COMPLÈTE - TYPH X-CHAIN</title>
    <style>
        body { font-family: monospace; background: #0A0F1F; color: white; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #131B2F; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #3B82F6; }
        button { background: #3B82F6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin: 10px; }
        .btn-danger { background: #EF4444; }
        .btn-success { background: #10B981; }
        .btn-warning { background: #F59E0B; }
        pre { background: #0A0F1F; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 500px; overflow-y: auto; }
        .log-success { color: #10B981; }
        .log-error { color: #EF4444; }
        .log-warning { color: #F59E0B; }
        .log-info { color: #3B82F6; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; background: #1A253C; color: white; border: 1px solid #2D3A4A; }
        .file-input {
            background: #1A253C;
            border: 2px dashed #3B82F6;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin: 20px 0;
        }
        .file-input:hover { border-color: #10B981; background: #1A253C; }
        .stats { background: #0A0F1F; padding: 15px; border-radius: 12px; margin: 10px 0; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>📦 RESTAURATION COMPLÈTE - TYPH X-CHAIN</h1>
        
        <div class="card">
            <h2>🔑 Connexion Admin</h2>
            <input type="email" id="email" placeholder="Email admin">
            <input type="password" id="password" placeholder="Mot de passe">
            <button onclick="connexion()">🔓 Se connecter</button>
            <div id="auth-status"></div>
        </div>
        
        <div class="card" id="actions-card" style="display: none;">
            <h2>📂 Importer le fichier backup.json</h2>
            
            <div class="file-input" onclick="document.getElementById('file-input').click()">
                📁 Cliquez pour sélectionner votre fichier backup.json
                <input type="file" id="file-input" accept=".json" style="display: none;" onchange="importerFichier(event)">
            </div>
            
            <div id="backup-preview"></div>
            
            <div id="restore-section" style="display: none;">
                <h2>⚙️ Restaurer</h2>
                <button class="btn-warning" onclick="restaurerComplet()">⚠️ RESTAURATION COMPLÈTE (Utilisateurs + Numéros + Adresses)</button>
            </div>
            
            <div id="progress"></div>
        </div>
        
        <div class="card">
            <h2>📝 Logs</h2>
            <pre id="logs">En attente...</pre>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAC6xQXWg_5EplLDPQu_7RuuQ0NrCUSQ2g",
            authDomain: "typhxchain.firebaseapp.com",
            databaseURL: "https://typhxchain-default-rtdb.firebaseio.com",
            projectId: "typhxchain",
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        let utilisateurCourant = null;
        let backupData = null;
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const color = type === 'error' ? '#EF4444' : (type === 'success' ? '#10B981' : (type === 'warning' ? '#F59E0B' : '#3B82F6'));
            logsDiv.innerHTML += `<div style="color: ${color}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }
        
        async function connexion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('auth-status');
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                utilisateurCourant = userCredential.user;
                statusDiv.innerHTML = `<div style="color:#10B981;">✅ Connecté: ${email}</div>`;
                document.getElementById('actions-card').style.display = 'block';
                log(`✅ Connecté - UID: ${utilisateurCourant.uid}`);
            } catch(error) {
                statusDiv.innerHTML = `<div style="color:#EF4444;">❌ ${error.message}</div>`;
                log(`❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        function importerFichier(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            log(`📁 Fichier: ${file.name}`);
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    backupData = JSON.parse(e.target.result);
                    analyserEtAfficherBackup(backupData);
                    document.getElementById('restore-section').style.display = 'block';
                    log(`✅ Fichier importé avec succès`, 'success');
                } catch(error) {
                    log(`❌ Erreur JSON: ${error.message}`, 'error');
                    document.getElementById('backup-preview').innerHTML = `<div style="color:#EF4444;">❌ Fichier JSON invalide</div>`;
                }
            };
            reader.readAsText(file);
        }
        
        function analyserEtAfficherBackup(data) {
            const previewDiv = document.getElementById('backup-preview');
            
            let stats = {
                totalUsers: 0,
                totalNumeros: 0,
                totalAdresses: 0,
                structure: "inconnue"
            };
            
            // Extraire les utilisateurs (quelle que soit la structure)
            let utilisateurs = null;
            
            if (data.data && data.data.utilisateurs) {
                utilisateurs = data.data.utilisateurs;
                stats.structure = "backup/data/utilisateurs";
            } else if (data.utilisateurs) {
                utilisateurs = data.utilisateurs;
                stats.structure = "backup/utilisateurs";
            } else if (data.donnees && data.donnees.utilisateurs) {
                utilisateurs = data.donnees.utilisateurs;
                stats.structure = "backup/donnees/utilisateurs";
            }
            
            if (utilisateurs) {
                stats.totalUsers = Object.keys(utilisateurs).length;
                
                for (const [uid, user] of Object.entries(utilisateurs)) {
                    if (user.numeros) stats.totalNumeros += Object.keys(user.numeros).length;
                    if (user.adressesLiees) stats.totalAdresses += Object.keys(user.adressesLiees).length;
                }
                
                previewDiv.innerHTML = `
                    <div class="stats">
                        <div style="color:#10B981;">✅ Backup valide</div>
                        <div>📁 Structure: ${stats.structure}</div>
                        <div>👥 Utilisateurs: ${stats.totalUsers}</div>
                        <div>📞 Numéros: ${stats.totalNumeros}</div>
                        <div>🔗 Adresses crypto: ${stats.totalAdresses}</div>
                    </div>
                `;
            } else {
                previewDiv.innerHTML = `<div class="stats" style="color:#EF4444;">❌ Structure non reconnue. La backup ne contient pas de données utilisateurs.</div>`;
                document.getElementById('restore-section').style.display = 'none';
            }
            
            // Sauvegarder les utilisateurs extraits
            window.utilisateursBackup = utilisateurs;
        }
        
        async function restaurerComplet() {
            if (!window.utilisateursBackup) {
                log("❌ Aucune backup chargée", 'error');
                return;
            }
            
            const totalUsers = Object.keys(window.utilisateursBackup).length;
            
            if (!confirm(`⚠️⚠️⚠️ RESTAURATION COMPLÈTE\n\nUtilisateurs: ${totalUsers}\nNuméros: ${Object.values(window.utilisateursBackup).reduce((s,u) => s + (u.numeros ? Object.keys(u.numeros).length : 0), 0)}\nAdresses: ${Object.values(window.utilisateursBackup).reduce((s,u) => s + (u.adressesLiees ? Object.keys(u.adressesLiees).length : 0), 0)}\n\nContinuer ?`)) {
                return;
            }
            
            log("🚀 DÉBUT DE LA RESTAURATION COMPLÈTE...");
            
            let traites = 0;
            let erreurs = 0;
            let numerosRestores = 0;
            let adressesRestores = 0;
            
            for (const [uid, userData] of Object.entries(window.utilisateursBackup)) {
                try {
                    // Restaurer les informations de base
                    const baseInfo = {
                        id: userData.id,
                        nom: userData.nom,
                        email: userData.email,
                        dateInscription: userData.dateInscription,
                        codePIN: userData.codePIN || { actif: false },
                        toursGratuits: userData.toursGratuits || 0,
                        filleulsCount: userData.filleulsCount || 0,
                        parrainId: userData.parrainId || '',
                        bonusParrainageDonne: userData.bonusParrainageDonne || false
                    };
                    
                    await database.ref(`donnees/utilisateurs/${uid}`).update(baseInfo);
                    
                    // Restaurer les numéros UN PAR UN
                    if (userData.numeros) {
                        for (const [numId, numData] of Object.entries(userData.numeros)) {
                            await database.ref(`donnees/utilisateurs/${uid}/numeros/${numId}`).set(numData);
                            numerosRestores++;
                            log(`📞 Numéro restauré: ${numData.nom || '?'} -> ${uid.substring(0,10)}...`, 'info');
                        }
                    }
                    
                    // Restaurer les adresses UN PAR UN
                    if (userData.adressesLiees) {
                        for (const [addrId, addrData] of Object.entries(userData.adressesLiees)) {
                            await database.ref(`donnees/utilisateurs/${uid}/adressesLiees/${addrId}`).set(addrData);
                            adressesRestores++;
                            log(`🔗 Adresse restaurée: ${addrData.label || '?'} -> ${uid.substring(0,10)}...`, 'info');
                        }
                    }
                    
                    traites++;
                    log(`✅ Utilisateur ${uid.substring(0,15)}... restauré (${traites}/${totalUsers})`, 'success');
                    
                } catch(e) {
                    erreurs++;
                    log(`❌ Erreur pour ${uid.substring(0,15)}...: ${e.message}`, 'error');
                }
            }
            
            log("=========================================");
            log(`✅ RESTAURATION TERMINÉE !`);
            log(`📊 Utilisateurs restaurés: ${traites}/${totalUsers}`);
            log(`📞 Numéros restaurés: ${numerosRestores}`);
            log(`🔗 Adresses restaurées: ${adressesRestores}`);
            log(`❌ Erreurs: ${erreurs}`);
            log("=========================================");
            
            alert(`✅ Restauration terminée !\n\n👥 Utilisateurs: ${traites}\n📞 Numéros: ${numerosRestores}\n🔗 Adresses: ${adressesRestores}\n❌ Erreurs: ${erreurs}`);
        }
    </script>
</body>
</html>
