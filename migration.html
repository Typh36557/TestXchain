<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>DÉCHIFFREMENT - TYPH X-CHAIN</title>
    <style>
        body { font-family: monospace; background: #0A0F1F; color: white; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .card { background: #131B2F; border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        button { background: #3B82F6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin: 10px; }
        .btn-danger { background: #EF4444; }
        .btn-success { background: #10B981; }
        pre { background: #0A0F1F; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 400px; overflow-y: auto; }
        .log-success { color: #10B981; }
        .log-error { color: #EF4444; }
        .log-warning { color: #F59E0B; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
</head>
<body>
    <div class="container">
        <h1>🔓 DÉCHIFFREMENT DES DONNÉES</h1>
        
        <div class="card">
            <h2>⚠️ Attention !</h2>
            <p>Ce script va DÉCHIFFRER toutes les données chiffrées.</p>
            <p>Les numéros et noms redeviendront LISIBLES en clair dans Firebase.</p>
            <p><strong>Cette opération est IRRÉVERSIBLE (sauf backup).</strong></p>
        </div>
        
        <div class="card">
            <h2>🔑 Connexion Admin</h2>
            <input type="email" id="email" placeholder="Email admin" style="width:100%; padding:10px; margin:5px 0; border-radius:8px;">
            <input type="password" id="password" placeholder="Mot de passe" style="width:100%; padding:10px; margin:5px 0; border-radius:8px;">
            <button onclick="connexion()">🔓 Se connecter</button>
            <div id="auth-status"></div>
        </div>
        
        <div class="card" id="actions-card" style="display: none;">
            <h2>⚙️ Actions</h2>
            <button onclick="sauvegarderBackup()" style="background:#F59E0B;">💾 1. Sauvegarder (backup)</button>
            <button onclick="dechiffrerTout()" style="background:#10B981;">🔓 2. DÉCHIFFRER toutes les données</button>
            <button onclick="verifierDechiffrement()" style="background:#3B82F6;">🔍 3. Vérifier</button>
            <div id="progress"></div>
        </div>
        
        <div class="card">
            <h2>📝 Logs</h2>
            <pre id="logs">En attente de connexion...</pre>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAC6xQXWg_5EplLDPQu_7RuuQ0NrCUSQ2g",
            authDomain: "typhxchain.firebaseapp.com",
            databaseURL: "https://typhxchain-default-rtdb.firebaseio.com",
            projectId: "typhxchain",
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        let utilisateurCourant = null;
        let backupEffectue = false;
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const color = type === 'error' ? '#EF4444' : (type === 'warning' ? '#F59E0B' : '#10B981');
            logsDiv.innerHTML += `<div style="color: ${color}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }
        
        function getCleChiffrement(uid) {
            return CryptoJS.SHA256(uid + "typhxchain-salt-2024").toString();
        }
        
        function dechiffrerDonnee(donneeChiffree, uid) {
            if (!donneeChiffree || !uid) return donneeChiffree;
            if (typeof donneeChiffree !== "string") return donneeChiffree;
            if (!donneeChiffree.startsWith("U2FsdGVkX1")) return donneeChiffree;
            try {
                const cle = getCleChiffrement(uid);
                const bytes = CryptoJS.AES.decrypt(donneeChiffree, cle);
                return bytes.toString(CryptoJS.enc.Utf8);
            } catch(e) {
                log(`Erreur déchiffrement: ${e.message}`, 'error');
                return donneeChiffree;
            }
        }
        
        async function connexion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('auth-status');
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                utilisateurCourant = userCredential.user;
                statusDiv.innerHTML = `<div style="color:#10B981;">✅ Connecté: ${email}</div>`;
                document.getElementById('actions-card').style.display = 'block';
                log(`✅ Connecté avec succès - UID: ${utilisateurCourant.uid}`);
            } catch(error) {
                statusDiv.innerHTML = `<div style="color:#EF4444;">❌ ${error.message}</div>`;
                log(`❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        async function sauvegarderBackup() {
            log("📦 Sauvegarde en cours...");
            try {
                const snapshot = await database.ref('donnees/utilisateurs').once('value');
                await database.ref('backup/avant_dechiffrement').set({
                    data: snapshot.val(),
                    date: new Date().toISOString(),
                    uid: utilisateurCourant.uid
                });
                backupEffectue = true;
                log("✅ Backup sauvegardé dans 'backup/avant_dechiffrement'");
            } catch(error) {
                log(`❌ Erreur backup: ${error.message}`, 'error');
            }
        }
        
        async function dechiffrerTout() {
            if (!utilisateurCourant) {
                log("❌ Connectez-vous d'abord", 'error');
                return;
            }
            
            if (!backupEffectue && !confirm("Aucun backup ! Continuer quand même ?")) return;
            
            log("🔓 DÉCHIFFREMENT en cours...");
            
            try {
                const snapshot = await database.ref('donnees/utilisateurs').once('value');
                const utilisateurs = snapshot.val() || {};
                
                let totalDechiffres = 0;
                
                for (const [uid, user] of Object.entries(utilisateurs)) {
                    log(`📝 Traitement: ${uid.substring(0,15)}...`);
                    
                    if (user.numeros) {
                        for (const [id, num] of Object.entries(user.numeros)) {
                            let modifie = false;
                            const updates = {};
                            
                            if (num.nom && typeof num.nom === 'string' && num.nom.startsWith("U2FsdGVkX1")) {
                                const dechiffre = dechiffrerDonnee(num.nom, uid);
                                if (dechiffre && dechiffre !== num.nom) {
                                    updates.nom = dechiffre;
                                    modifie = true;
                                }
                            }
                            
                            if (num.numero && typeof num.numero === 'string' && num.numero.startsWith("U2FsdGVkX1")) {
                                const dechiffre = dechiffrerDonnee(num.numero, uid);
                                if (dechiffre && dechiffre !== num.numero) {
                                    updates.numero = dechiffre;
                                    modifie = true;
                                }
                            }
                            
                            if (modifie) {
                                await database.ref(`donnees/utilisateurs/${uid}/numeros/${id}`).update(updates);
                                totalDechiffres++;
                                log(`  ✅ Déchiffré: ${updates.nom || updates.numero}`, 'success');
                            }
                        }
                    }
                }
                
                log("=========================================");
                log(`✅ DÉCHIFFREMENT TERMINÉ ! ${totalDechiffres} données déchiffrées`);
                log("=========================================");
                
            } catch(error) {
                log(`❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        async function verifierDechiffrement() {
            log("🔍 Vérification...");
            
            try {
                const snapshot = await database.ref('donnees/utilisateurs').once('value');
                const utilisateurs = snapshot.val() || {};
                
                let resteChiffre = 0;
                
                for (const [uid, user] of Object.entries(utilisateurs)) {
                    if (user.numeros) {
                        for (const [id, num] of Object.entries(user.numeros)) {
                            if (num.nom && num.nom.startsWith("U2FsdGVkX1")) resteChiffre++;
                            if (num.numero && num.numero.startsWith("U2FsdGVkX1")) resteChiffre++;
                        }
                    }
                }
                
                if (resteChiffre === 0) {
                    log("✅ TOUTES les données sont en CLAIR !");
                } else {
                    log(`⚠️ ${resteChiffre} données encore chiffrées. Relancez le déchiffrement.`, 'warning');
                }
                
            } catch(error) {
                log(`❌ Erreur: ${error.message}`, 'error');
            }
        }
    </script>
</body>
</html>
