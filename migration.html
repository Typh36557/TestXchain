<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>IMPORT BACKUP - TYPH X-CHAIN</title>
    <style>
        body { font-family: monospace; background: #0A0F1F; color: white; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        .card { background: #131B2F; border-radius: 16px; padding: 20px; margin-bottom: 20px; border: 1px solid #3B82F6; }
        button { background: #3B82F6; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; margin: 10px; }
        .btn-danger { background: #EF4444; }
        .btn-success { background: #10B981; }
        .btn-warning { background: #F59E0B; }
        pre { background: #0A0F1F; padding: 10px; border-radius: 8px; overflow-x: auto; font-size: 12px; max-height: 500px; overflow-y: auto; }
        .log-success { color: #10B981; }
        .log-error { color: #EF4444; }
        .log-warning { color: #F59E0B; }
        input { width: 100%; padding: 10px; margin: 5px 0; border-radius: 8px; background: #1A253C; color: white; border: 1px solid #2D3A4A; }
        .file-input {
            background: #1A253C;
            border: 2px dashed #3B82F6;
            border-radius: 16px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            margin: 20px 0;
        }
        .file-input:hover { border-color: #10B981; background: #1A253C; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <div class="container">
        <h1>📤 IMPORT BACKUP - TYPH X-CHAIN</h1>
        
        <div class="card">
            <h2>🔑 Connexion Admin</h2>
            <input type="email" id="email" placeholder="Email admin">
            <input type="password" id="password" placeholder="Mot de passe">
            <button onclick="connexion()">🔓 Se connecter</button>
            <div id="auth-status"></div>
        </div>
        
        <div class="card" id="actions-card" style="display: none;">
            <h2>📂 Étape 1 : Importer le fichier backup.json</h2>
            
            <div class="file-input" onclick="document.getElementById('file-input').click()">
                📁 Cliquez ou glissez votre fichier backup.json ici
                <input type="file" id="file-input" accept=".json" style="display: none;" onchange="importerFichier(event)">
            </div>
            
            <div id="backup-preview"></div>
            
            <h2>⚙️ Étape 2 : Restaurer</h2>
            <button class="btn-warning" id="btn-restaurer" onclick="restaurerBackup()" disabled>⚠️ RESTAURER POUR TOUS LES UTILISATEURS</button>
            
            <div id="progress"></div>
        </div>
        
        <div class="card">
            <h2>📝 Logs</h2>
            <pre id="logs">En attente...</pre>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAC6xQXWg_5EplLDPQu_7RuuQ0NrCUSQ2g",
            authDomain: "typhxchain.firebaseapp.com",
            databaseURL: "https://typhxchain-default-rtdb.firebaseio.com",
            projectId: "typhxchain",
        };
        
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const auth = firebase.auth();
        
        let utilisateurCourant = null;
        let backupData = null;
        let backupFileName = null;
        
        function log(message, type = 'info') {
            const logsDiv = document.getElementById('logs');
            const color = type === 'error' ? '#EF4444' : (type === 'success' ? '#10B981' : (type === 'warning' ? '#F59E0B' : '#3B82F6'));
            logsDiv.innerHTML += `<div style="color: ${color}">[${new Date().toLocaleTimeString()}] ${message}</div>`;
            logsDiv.scrollTop = logsDiv.scrollHeight;
            console.log(message);
        }
        
        async function connexion() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const statusDiv = document.getElementById('auth-status');
            
            try {
                const userCredential = await auth.signInWithEmailAndPassword(email, password);
                utilisateurCourant = userCredential.user;
                statusDiv.innerHTML = `<div style="color:#10B981;">✅ Connecté: ${email}</div>`;
                document.getElementById('actions-card').style.display = 'block';
                log(`✅ Connecté - UID: ${utilisateurCourant.uid}`);
            } catch(error) {
                statusDiv.innerHTML = `<div style="color:#EF4444;">❌ ${error.message}</div>`;
                log(`❌ Erreur: ${error.message}`, 'error');
            }
        }
        
        function importerFichier(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            backupFileName = file.name;
            log(`📁 Fichier sélectionné: ${backupFileName}`);
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const contenu = JSON.parse(e.target.result);
                    backupData = contenu;
                    afficherApercuBackup(contenu);
                    log(`✅ Fichier importé avec succès`, 'success');
                    document.getElementById('btn-restaurer').disabled = false;
                } catch(error) {
                    log(`❌ Erreur de lecture JSON: ${error.message}`, 'error');
                    document.getElementById('backup-preview').innerHTML = `<div style="color:#EF4444;">❌ Fichier JSON invalide</div>`;
                    document.getElementById('btn-restaurer').disabled = true;
                }
            };
            reader.readAsText(file);
        }
        
        function afficherApercuBackup(data) {
            const previewDiv = document.getElementById('backup-preview');
            
            let utilisateurs = {};
            let totalNumeros = 0;
            let totalUsers = 0;
            
            // Détection de la structure
            if (data.data && data.data.utilisateurs) {
                utilisateurs = data.data.utilisateurs;
                totalUsers = Object.keys(utilisateurs).length;
                for (const [uid, user] of Object.entries(utilisateurs)) {
                    if (user.numeros) totalNumeros += Object.keys(user.numeros).length;
                }
                
                previewDiv.innerHTML = `
                    <div style="background:#1A253C; padding:15px; border-radius:8px; margin-top:10px;">
                        <div style="color:#10B981;">✅ Fichier valide</div>
                        <div>📁 Fichier: ${backupFileName}</div>
                        <div>📅 Date backup: ${data.date || 'Non spécifiée'}</div>
                        <div>👥 Utilisateurs: ${totalUsers}</div>
                        <div>📞 Numéros: ${totalNumeros}</div>
                        <div>📊 Structure: backup complète</div>
                    </div>
                `;
                
            } else if (data.utilisateurs) {
                utilisateurs = data.utilisateurs;
                totalUsers = Object.keys(utilisateurs).length;
                for (const [uid, user] of Object.entries(utilisateurs)) {
                    if (user.numeros) totalNumeros += Object.keys(user.numeros).length;
                }
                
                previewDiv.innerHTML = `
                    <div style="background:#1A253C; padding:15px; border-radius:8px; margin-top:10px;">
                        <div style="color:#10B981;">✅ Fichier valide</div>
                        <div>📁 Fichier: ${backupFileName}</div>
                        <div>👥 Utilisateurs: ${totalUsers}</div>
                        <div>📞 Numéros: ${totalNumeros}</div>
                        <div>📊 Structure: utilisateurs</div>
                    </div>
                `;
                
            } else {
                previewDiv.innerHTML = `<div style="color:#EF4444;">❌ Structure de fichier non reconnue</div>`;
                document.getElementById('btn-restaurer').disabled = true;
            }
        }
        
        async function restaurerBackup() {
            if (!backupData) {
                log("❌ Aucun fichier backup chargé", 'error');
                return;
            }
            
            if (!confirm("⚠️⚠️⚠️ Voulez-vous RESTAURER cette backup pour TOUS les utilisateurs ?\n\nLes données actuelles seront REMPLACÉES !\n\nCette action est IRRÉVERSIBLE !")) {
                return;
            }
            
            log("🚀 DÉBUT DE LA RESTAURATION GLOBALE...");
            
            try {
                // Extraire les utilisateurs selon la structure
                let utilisateurs = {};
                if (backupData.data && backupData.data.utilisateurs) {
                    utilisateurs = backupData.data.utilisateurs;
                } else if (backupData.utilisateurs) {
                    utilisateurs = backupData.utilisateurs;
                } else {
                    throw new Error("Structure de backup non reconnue");
                }
                
                const totalUsers = Object.keys(utilisateurs).length;
                let traites = 0;
                let erreurs = 0;
                
                log(`📦 ${totalUsers} utilisateur(s) à restaurer...`);
                
                for (const [uid, userData] of Object.entries(utilisateurs)) {
                    try {
                        // Restaurer les données utilisateur
                        await database.ref(`donnees/utilisateurs/${uid}`).set(userData);
                        traites++;
                        log(`✅ Utilisateur ${uid.substring(0,15)}... restauré (${traites}/${totalUsers})`, 'success');
                    } catch(e) {
                        erreurs++;
                        log(`❌ Erreur pour ${uid.substring(0,15)}...: ${e.message}`, 'error');
                    }
                }
                
                log("=========================================");
                log(`✅ RESTAURATION TERMINÉE !`);
                log(`📊 Utilisateurs restaurés: ${traites}`);
                log(`❌ Erreurs: ${erreurs}`);
                log("=========================================");
                
                alert(`✅ Restauration terminée !\n\nUtilisateurs restaurés: ${traites}\nErreurs: ${erreurs}`);
                
            } catch(error) {
                log(`❌ Erreur globale: ${error.message}`, 'error');
                alert(`❌ Erreur: ${error.message}`);
            }
        }
    </script>
</body>
</html>
